<form [formGroup]="materialCompuestoForm" class="contenido-principal" (ngSubmit)="onSubmit()">
  <h1 class="titulo-seccion">Crear Material Compuesto</h1>

  <mat-tab-group>
    <mat-tab label="Detalles Generales">
      <mat-card class="card-seccion">
        <h3 class="titulo-card">Detalles Generales</h3>

        <div class="fila">
          <mat-form-field class="campo">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre">
          </mat-form-field>

          <mat-form-field class="campo">
            <mat-label>Código</mat-label>
            <input matInput formControlName="codigo">
          </mat-form-field>
        </div>

        <div class="fila">
          <mat-form-field class="campo campo-largo">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="descripcion"></textarea>
          </mat-form-field>
        </div>

        <div class="fila">
          <mat-form-field class="campo">
            <mat-label>Unidad de Medida</mat-label>
            <mat-select formControlName="unidadMedida">
              <mat-option *ngFor="let unidad of unidadesMedida" [value]="unidad">{{ unidad }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field class="campo">
            <mat-label>Cantidad Total</mat-label>
            <input matInput type="number" formControlName="cantidad">
          </mat-form-field>

          <mat-form-field class="campo">
            <mat-label>Alerta Stock</mat-label>
            <input matInput type="number" formControlName="alertaStock">
          </mat-form-field>
        </div>
      </mat-card>
    </mat-tab>

    <mat-tab label="Materiales Usados">
      <mat-card class="card-seccion">
        <h3 class="titulo-card">Agregar Materiales</h3>

        <div formArrayName="materialesUsados">
          <div *ngFor="let material of materialesUsadosArray.controls; let i = index" [formGroupName]="i" class="fila-material">
            <mat-form-field class="campo">
              <mat-label>Material</mat-label>
              <mat-select formControlName="material">
                <mat-option *ngFor="let mat of materiales" [value]="mat._id">{{ mat.nombre }}</mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field class="campo">
              <mat-label>Cantidad</mat-label>
              <input matInput type="number" formControlName="cantidad">
            </mat-form-field>

            <mat-form-field class="campo">
              <mat-label>Unidad de Medida</mat-label>
              <mat-select formControlName="unidadMedida">
                <mat-option *ngFor="let unidad of unidadesMedida" [value]="unidad">{{ unidad }}</mat-option>
              </mat-select>
            </mat-form-field>

            <button mat-icon-button color="warn" (click)="eliminarMaterial(i)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>

        <div class="acciones-materiales">
          <button mat-stroked-button color="primary" type="button" (click)="agregarMaterial()">
            Agregar Material
          </button>
        </div>
      </mat-card>
    </mat-tab>
  </mat-tab-group>

  <div class="acciones-finales">
    <button mat-flat-button color="primary" type="submit">
      Guardar Material Compuesto
    </button>
  </div>
</form>
