<form [formGroup]="ventaForm" (ngSubmit)="onSubmit()" class="contenido-principal">
  <h3 class="titulo-seccion">Registrar Venta</h3>

  <div formArrayName="productosVendidos">
    <div *ngFor="let grupo of productosVendidos.controls; let i = index" [formGroupName]="i">
      <mat-card class="card-seccion">
        <h2 class="titulo-card">Producto {{ i + 1 }}</h2>

        <div class="fila">
          <mat-form-field class="campo">
            <mat-label>Producto</mat-label>
            <mat-select formControlName="productoId">
              <mat-option *ngFor="let producto of productos$ | async" [value]="producto._id">
                {{ producto.nombre }} (Stock: {{ producto.cantidad }} {{ producto.unidadMedida }})
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field class="campo">
            <mat-label>Cantidad Vendida</mat-label>
            <input matInput type="number" formControlName="cantidadVendida">
          </mat-form-field>

          <mat-form-field class="campo">
            <mat-label>Precio Unitario</mat-label>
            <input matInput type="number" formControlName="precioUnitario">
          </mat-form-field>

          <button mat-icon-button type="button" (click)="quitarProducto(i)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </mat-card>
    </div>
  </div>

  <div class="acciones-finales">
    <button mat-flat-button color="primary" type="button" (click)="agregarProducto()">
      Agregar otro producto
    </button>
    <button mat-flat-button color="accent" type="submit" [disabled]="ventaForm.invalid">
      Registrar Venta
    </button>
  </div>
</form>
