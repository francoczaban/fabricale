<mat-dialog-content class="mat-typography">
    <h2 mat-dialog-title>Alertas de stock</h2>
    <p>Los siguientes elementos se están quedando sin stock, según los parámetros de alerta. Por favor revisar:</p>

    <!-- Tabla con los productos -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- Columna para el nombre del producto -->
        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{ element.nombre }} </td>
        </ng-container>

        <!-- Columna para la cantidad -->
        <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef> Cantidad </th>
            <td mat-cell *matCellDef="let element"> {{ element.cantidad }} </td>
        </ng-container>

        <!-- Columna para unidad de medida -->
        <ng-container matColumnDef="unidadMedida">
            <th mat-header-cell *matHeaderCellDef> Unidad de Medida </th>
            <td mat-cell *matCellDef="let element"> {{ element.unidadMedida }} </td>
        </ng-container>

        <!-- Columna para la alerta de stock -->
        <ng-container matColumnDef="alertaStock">
            <th mat-header-cell *matHeaderCellDef> Alerta de Stock </th>
            <td mat-cell *matCellDef="let element"> {{ element.alertaStock }} </td>
        </ng-container>

        <!-- Columna para especificar el tipo -->
        <ng-container matColumnDef="tipo">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let element"> {{ element.tipo }} </td>
        </ng-container>

        <!-- Cabecera y filas de la tabla -->
        <tr mat-header-row *matHeaderRowDef="['nombre', 'cantidad', 'unidadMedida', 'alertaStock', 'tipo']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['nombre', 'cantidad', 'unidadMedida', 'alertaStock', 'tipo'];"></tr>
    </table>

</mat-dialog-content>



<mat-dialog-actions>
    <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
