<form class="materialesform" (ngSubmit)="agregarCantidades()" style="place-self: center;">
    <h3 style="text-align: center;">Editar Material</h3>
    <div>
        <div>
            <mat-form-field class="example-full-width" style="width: 420px;">
                <mat-label>Nombre:</mat-label>
                <input matInput id="nombre" name="nombre" [(ngModel)]="this.datos.nombre" readonly>
            </mat-form-field>
        </div>
    </div>

    <div>
        <mat-form-field class="example-full-width" style="width: 420px;">
            <mat-label>Cantidad:</mat-label>
            <input matInput type="text" id="cantidad" name="cantidad" [(ngModel)]="this.datos.cantidad" readonly>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field class="example-full-width" style="width: 420px;">
            <mat-label>Unidad de Medida:</mat-label>
            <input matInput type="text" id="unidadMedida" name="unidadMedida" [(ngModel)]="this.datos.unidadMedida" readonly>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field class="example-full-width" style="width: 420px;">
            <mat-label>Cantidad a agregar:</mat-label>
            <input matInput type="number" id="cantidadAgregada" name="cantidadAgregada" [(ngModel)]="this.cantidad">
        </mat-form-field>
    </div>

    <div>
        <button mat-flat-button color="primary" style="width: 420px;" type="submit">Guardar Material</button>
    </div>
</form>
